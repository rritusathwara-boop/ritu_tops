<html>
	<head>
		 <title>Simple Website Layout</title>
		<style>
        body 	
		{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        header
		{
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav
		{
            background-color: #555;
            padding: 10px;
        }

        nav a 
		{
            color: white;
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
        }

        nav a:hover
		{
            text-decoration: underline;
        }

        main 
		{
            padding: 20px;
            min-height: 300px;
        }

        footer 
		{
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }
		</style>
	</head>
	<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my simple HTML page</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <h2>Main Content</h2>
        <p>
            This is the main content area of the page.
            You can add articles, images, forms, or anything else here.
        </p>
    </main>

    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

	</body>
</html>
