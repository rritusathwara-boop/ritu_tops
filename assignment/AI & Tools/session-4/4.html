<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flipkart Sale Banner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }
    .banner {
      width: 1200px;
      max-width: 95vw;
      height: 500px;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: linear-gradient(135deg, #fff0f0 0%, #ffe8d7 18%, #ffffff 35%, #fffaf2 100%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.12);
    }
    .shape1, .shape2, .shape3 {
      position: absolute;
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0.7;
    }
    .shape1 { width: 300px; height: 300px; background: rgba(255, 98, 0, 0.12); right: 120px; top: -60px; }
    .shape2 { width: 280px; height: 280px; background: rgba(255, 0, 76, 0.1); left: 80px; bottom: -80px; }
    .shape3 { width: 200px; height: 200px; background: rgba(255, 183, 0, 0.15); left: 420px; top: 230px; }
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      height: 100%;
      padding: 50px 60px;
      align-items: center;
      justify-content: space-between;
    }
    .text-block {
      max-width: 520px;
    }
    .mini-tag {
      display: inline-block;
      background: #fff;
      color: #ff3d00;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      font-size: 14px;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 62px;
      line-height: 1.02;
      letter-spacing: -2px;
      color: #111827;
    }
    h1 .highlight {
      color: #ff3d00;
    }
    .tagline {
      margin-top: 18px;
      font-size: 30px;
      font-weight: 800;
      color: #111827;
      letter-spacing: -1px;
    }
    .tagline .sale {
      color: #ff3d00;
    }
    .cta {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .shop-btn {
      background: linear-gradient(90deg, #ff4d2d, #ff7a00);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 18px 30px;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 12px 20px rgba(255, 90, 60, 0.25);
      cursor: pointer;
    }
    .offer-box {
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(255, 77, 45, 0.2);
      border-radius: 16px;
      padding: 12px 18px;
      font-weight: 800;
      color: #111827;
      box-shadow: 0 8px 18px rgba(0,0,0,0.06);
    }
    .products {
      position: relative;
      width: 500px;
      height: 360px;
      display: flex;
      align-items: end;
      justify-content: center;
    }
    .device {
      position: absolute;
      bottom: 0;
      border-radius: 28px;
      background: linear-gradient(180deg, #f8fafc, #dfe7ef);
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.18);
      border: 8px solid #e2e8f0;
    }
    .phone {
      width: 170px;
      height: 240px;
      right: 150px;
      transform: rotate(-12deg);
      z-index: 3;
    }
    .laptop {
      width: 260px;
      height: 165px;
      right: 60px;
      bottom: 20px;
      z-index: 4;
    }
    .watch {
      width: 90px;
      height: 130px;
      right: 330px;
      bottom: 40px;
      z-index: 5;
      transform: rotate(12deg);
    }
    .shoe {
      position: absolute;
      width: 210px;
      height: 80px;
      background: linear-gradient(90deg, #2d3748, #4a5568);
      border-radius: 50px 30px 40px 30px;
      right: 10px;
      bottom: 55px;
      transform: rotate(-16deg);
      z-index: 2;
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }
    .shoe::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 35px;
      background: rgba(255,255,255,0.2);
      border-radius: 18px;
      left: 36px;
      top: 16px;
    }
    .shoe::after {
      content: "";
      position: absolute;
      width: 190px;
      height: 14px;
      background: rgba(0,0,0,0.15);
      border-radius: 20px;
      left: 10px;
      bottom: -12px;
    }
    .tag {
      position: absolute;
      right: 32px;
      top: 30px;
      background: #ffecb3;
      color: #7a3800;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 24px;
      transform: rotate(12deg);
      box-shadow: 0 10px 18px rgba(122,56,0,0.15);
      z-index: 8;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="shape1"></div>
    <div class="shape2"></div>
    <div class="shape3"></div>
    <div class="tag">Biggest Sale of the Year!</div>

    <div class="content">
      <div class="text-block">
        <div class="mini-tag">FLIPKART SALE LIVE</div>
        <h1>UPTO <span class="highlight">80% OFF</span></h1>
        <div class="tagline"><span class="sale">Biggest Sale</span> of the Year!</div>
        <div class="cta">
          <button class="shop-btn">Shop Now</button>
          <div class="offer-box">Free Delivery + Extra Savings</div>
        </div>
      </div>

      <div class="products">
        <div class="shoe"></div>
        <div class="device watch"></div>
        <div class="device phone"></div>
        <div class="device laptop"></div>
      </div>
    </div>
  </div>
</body>
</html>
